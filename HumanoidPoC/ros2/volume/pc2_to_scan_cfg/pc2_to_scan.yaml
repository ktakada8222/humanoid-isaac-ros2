pointcloud_to_laserscan:
  ros__parameters:
    target_frame: "base_link"
    transform_tolerance: 0.01
    min_height: -0.54
    max_height: 0.5
    angle_min: -3.14
    angle_max: 3.14
    angle_increment: 0.0087
    scan_time: 0.1
    range_min: 0.1
    range_max: 10.0 # 10m先まで見る
    use_inf: true
