# Nav2のパラメータの意味は下記webページが参考になるかも
# https://robo-marc.github.io/navigation_documents/introduction.html
# https://docs.nav2.org/configuration/index.html

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""  # launchファイルから渡される

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0 # 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.25 # 0.5
      use_astar: false
      allow_unknown: true
      # use_final_approach_orientation: true

controller_server:
  ros__parameters:
    use_sim_time: false
    holonomic: true
    controller_frequency: 20.0 # 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001 # 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    # publish_zero_velocity: true
    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True # True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.4  # 0.25
      yaw_goal_tolerance: 0.5 # OK 0.75  # 0.25
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0 # -1.0
      min_vel_y: -1.0 # -1.0
      max_vel_x: 1.0 # 1.0 # ロボットの縦方向速度の上限
      max_vel_y: 1.0 # 1.0
      max_vel_theta: 1.0 #ロボットの回転速度絶対値の上限
      min_speed_xy: 0.0
      max_speed_xy: 1.0 # 1.0 # ロボットの最大移動速度（m/s）
      min_speed_theta: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 0.5 # 前後加速度の上限rviz2 -d /home/tron/tron_ws/src/hdl_localization/rviz/hdl_localization_for_TRON1_2.rviz
      acc_lim_y: 0.5 # 横方向加速度の上限
      acc_lim_theta: 1.0 # 3.2
      decel_lim_x: -0.5 # 前後減速度の上限
      decel_lim_y: -0.5 # 横方向減速度の上限
      decel_lim_theta: -1.0 # -3.2
      vx_samples: 20
      vy_samples: 20 # 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25 # 0.25
      trans_stopped_velocity: 0.05
      shorten_transformed_plan: False # True
      short_circuit_trajectory_evaluation: False # True
      stateful: True # True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 40.0 # maybe ok 50.0 # 0.02
      PathAlign.scale: 32.0  # 32.0 #bigger will realize to go along the path
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 10.0 # 32.0 #priority of rotation 
      RotateToGoal.slowing_factor: 5.0 # 5.0 #smoller will become easy to rotate
      RotateToGoal.lookahead_time: -1.0

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.5, 1.0]
    min_velocity: [-0.0, -0.5, -1.0]
    max_accel: [0.5, 0.5, 1.0]
    max_decel: [-0.5, -0.5, -1.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    
behavior_server:
  ros__parameters:
    use_sim_time: false
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

bt_navigator:
  ros__parameters:
    use_sim_time: false
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"
    robot_base_frame: base_link

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false # true:到達失敗したら止まる
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 5000 # 各地点でNミリ秒停止

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map # 地図の座標系. 地図全体での経路を計算するため
      robot_base_frame: base_link
      update_quency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true
      # robot_radius: 0.4 # radius set and used, so no footprint points
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.5  # コストマップに挿入される障害物の最大の高さ。 このパラメータは、ロボットの高さよりわずかに高く設定する必要があります。
          min_obstacle_height: 0.0
          obstacle_range: 6.0
          raytrace_range: 8.0
          marking: true
          clearing: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0 # 3.0 → **2.5** で膨張を緩やかに
        inflation_radius: 0.2 # 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom # odomの座標系. ロボットの周囲の障害物を検出して経路を計算するため
      robot_base_frame: base_link
      update_frequency:  5.0
      publish_frequency: 5.0
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.5 # コストマップに挿入される障害物の最大の高さ。 このパラメータは、ロボットの高さよりわずかに高く設定する必要があります。
          min_obstacle_height: 0.0
          obstacle_range: 6.0
          raytrace_range: 8.0
          marking: true
          clearing: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0 # 3.0 → **2.5** で膨張を緩やかに
        inflation_radius: 0.2 # 0.5