qr_tracker_node:
  ros__parameters:
    # Topics
    camera_topic: "/camera/color/image_raw"
    cmd_vel_topic: "/cmd_vel"
    success_flag_topic: "/nav2/success_flag"
    goal_pose_topic: "/goal_pose"
    done_topic: "/finepositioning/done"
    image_queue_size: 5

    # TF & proximity
    base_frame_id: "base_link"
    stop_distance_thresh_m: 0.15

    # Camera model / QR
    qr_size_m: 0.16
    fx: 0.0               # 0 → derive from HFOV
    camera_hfov_deg: 70.0

    # Control
    target_distance_m: 0.70
    linear_kp: 0.8
    angular_kp: 0.006     # per pixel
    max_linear_x: 0.25
    max_angular_z: 0.6
    search_angular_z: 0.2
    invert_x: false

    # Done thresholds
    done_yaw_thresh_deg: 5.0
    done_range_tolerance_m: 0.05
